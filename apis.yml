name: PropTiger
description: 'PropTiger.com is one of India''s leading online real estate advisory and
  transaction platforms, founded in 2011 and now part of the REA India group (alongside
  Housing.com). It helps home buyers discover, evaluate, and purchase residential property
  across major Indian cities, combining property search and locality research with on-ground
  advisory, legal paperwork guidance, and home-loan assistance. The public surface is a
  consumer-facing web and mobile marketplace; as of this enrichment pass PropTiger publishes
  no public developer portal, API documentation, OpenAPI/AsyncAPI specification, SDKs, or
  MCP server. This profile captures verifiable company identity, published consumer pages,
  and live domain-security posture. Backed by Accel.'
